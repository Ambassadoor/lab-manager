name: API types

# backend/openapi.json and frontend/src/types/api.ts are generated by the
# pre-commit hook. A commit made without the hook installed (a fresh clone,
# or --no-verify) can leave them out of date, so the frontend's types no
# longer match the API. This regenerates both and fails if anything changed.

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/src/types/**"
      - "frontend/package.json"
      - "scripts/generate-api-types.sh"
      - ".github/workflows/api-types.yml"
  # No paths filter here: this is a required check, and a required check
  # that never starts leaves the pull request waiting forever.
  pull_request:
    branches: [main, develop]

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    env:
      # Generating the schema imports Django but never connects to the database.
      SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-root

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Regenerate
        run: ./scripts/generate-api-types.sh

      - name: Compare with the committed files
        run: |
          if ! git diff --exit-code -- backend/openapi.json frontend/src/types/api.ts; then
            echo "::error::openapi.json or api.ts is out of date. Run ./scripts/generate-api-types.sh (or install the hooks: git config core.hooksPath .githooks) and commit the result."
            exit 1
          fi
