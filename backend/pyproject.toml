[project]
name = "backend"
version = "0.1.0"
description = "Lab Manager API"
authors = [
    {name = "Caleb Pittman",email = "ambassadoor.dev@gmail.com"}
]
requires-python = ">3.14.5"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-filter (>=25.2,<26.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "ruff (>=0.15.13,<0.16.0)"
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]
